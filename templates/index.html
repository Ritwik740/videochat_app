<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call Platform</title>
</head>
<body>
    <h1>Welcome to the Video Call Platform</h1>
    <button id="createRoomButton">Create Room</button>
    <br>
    <label for="roomCode">Enter Room Code:</label>
    <input type="text" id="roomCode" placeholder="Room Code">
    <button id="joinRoomButton">Join Room</button>

    <script src="https://cdn.socket.io/4.4.1/socket.io.min.js"></script>
    <script>
        const socket = io();
        
        document.getElementById('createRoomButton').onclick = function() {
            socket.emit('create_room');
        }

        document.getElementById('joinRoomButton').onclick = function() {
            const roomCode = document.getElementById('roomCode').value;
            socket.emit('join_room', { room_code: roomCode });
        }

        socket.on('room_created', function(data) {
            alert('Room created with code: ' + data.room_code);
            window.location.href = '/room/' + data.room_code;  // Redirect to the room
        });

        socket.on('room_error', function(data) {
            alert(data.message);
        });
    </script>
</body>
</html>
